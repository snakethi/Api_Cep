name: Build and Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./ApiCep/ApiCep.sln

      - name: Build solution
        run: dotnet build ./ApiCep/ApiCep.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./ApiCep/ApiCep.sln --configuration Release --no-build --verbosity normal